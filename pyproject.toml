[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-algo-wiki-topology"
version = "0.0.0"
description = "M0 topology visualization baseline for PA_Module_Simplified"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "svgwrite>=1.4",
  "pytest>=8.0",
  "ortools>=9.10",
]

[project.scripts]
schema_check = "tools.schema_check:main"
topology_viz = "tools.topology_viz:main"
frontend_compile = "tools.frontend_compile:main"
solver_ir = "tools.solver_ir:main"
cpsat_solve = "tools.cpsat_solve:main"
pcb_solve = "tools.pcb_solve_v2:main"
pcb_solve_v1 = "tools.pcb_solve:main"
pcb_solve_v2 = "tools.pcb_solve_v2:main"

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint.per-file-ignores]
"tools/schema_check.py" = ["E402"]
"tools/topology_viz.py" = ["E402"]
"tools/frontend_compile.py" = ["E402"]
"tools/solver_ir.py" = ["E402"]
"tools/cpsat_solve.py" = ["E402"]
"tools/pcb_solve.py" = ["E402"]
"tools/pcb_solve_v2.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["topology", "topology.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# OR-Tools cp_model has incomplete type stubs (Add/NewIntVar/etc. are
# dynamically generated). The solver package uses them extensively; defer
# strict typing here until upstream stubs catch up.
module = ["solver.cpsat", "solver.extract"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["ortools", "ortools.*"]
ignore_missing_imports = true
