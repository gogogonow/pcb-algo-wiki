    - stepped_impedance
    - manifold_junction
    connection_rules:    #连接规则，承载微带线或附带RLC间连接位置详情
      reference_edge: IC1_pin1_seg1    #连接点参考的微带线名称
      branches:
      - edge: IC1_pin1_seg3
        angle: 90
        origin:
          offset_u: -1.6
          offset_v: edge_left
      - edge: IC1_pin1_seg4
        angle: 0    #0表示IC1_pin1_seg4与IC1_pin1_seg1方向一致
        origin:
          offset_u: align_left    #align_left表示IC1_pin1_seg4与IC1_pin1_seg1左边对齐
          offset_v: edge_front    #edge_front表示IC1_pin1_seg4与IC1_pin1_seg1前向边相连
